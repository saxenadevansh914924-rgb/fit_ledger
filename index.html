<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101713" />
    <title>FitLedger — Gym & Paisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5f1;
        --paper: #fff;
        --ink: #17221c;
        --muted: #7b877e;
        --line: #e7ebe5;
        --green: #c5f36b;
        --deep: #14231a;
        --lime: #d5ff80;
        --red: #ed795f;
        --shadow: 0 12px 40px #1930210b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr);
        min-height: 100vh;
      }
      .mobile-menu-toggle {
        display: none;
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        color: var(--deep);
        font-size: 22px;
        line-height: 1;
      }
      .nav-backdrop {
        display: none;
      }
      .side {
        background: var(--deep);
        color: #fff;
        padding: 27px 18px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 8px;
        font-family: Manrope;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.7px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        background: var(--lime);
        display: grid;
        place-items: center;
        color: var(--deep);
        font-size: 21px;
      }
      .brand small {
        display: block;
        color: #94a39a;
        font: 500 10px "DM Sans";
        letter-spacing: 1.3px;
        margin-top: 2px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #7e9185;
        padding: 0 12px;
        margin-bottom: 8px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        border: 0;
        background: none;
        color: #aab7ae;
        text-align: left;
        padding: 12px 13px;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.2s;
      }
      .nav button span {
        font-size: 17px;
        width: 20px;
        text-align: center;
      }
      .nav button.active,
      .nav button:hover {
        background: #27382d;
        color: white;
      }
      .nav button.active {
        box-shadow: inset 3px 0 var(--lime);
      }
      .side-bottom {
        margin-top: auto;
      }
      .userbox {
        padding: 14px 9px;
        border-top: 1px solid #334339;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .profile-trigger {
        flex:1;
        min-width:0;
        display:flex;
        align-items:center;
        gap:10px;
        padding:0;
        border:0;
        background:none;
        color:inherit;
        text-align:left;
        cursor:pointer;
      }
      .profile-trigger:hover { opacity:.85; }
      .avatar {
        width: 34px;
        height: 34px;
        background: #344638;
        color: var(--lime);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .userbox div:nth-child(2) {
        min-width: 0;
        flex: 1;
      }
      .profile-trigger div:nth-child(2) { min-width:0; flex:1; }
      .userbox b {
        font-size: 12px;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .userbox small {
        font-size: 10px;
        color: #94a39a;
      }
      .logout {
        background: none;
        border: 0;
        color: #9ba99e;
        font-size: 18px;
      }
      .main {
        padding: 28px clamp(20px, 4vw, 56px) 54px;
        max-width: 1600px;
        width: 100%;
        margin: auto;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #7b877e;
        font-size: 10px;
        font-weight: 700;
      }
      .topline h1 {
        font: 800 27px Manrope;
        margin: 5px 0 0;
        letter-spacing: -1px;
      }
      .date-chip {
        background: white;
        border: 1px solid var(--line);
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 12px;
        color: #46534a;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
      }
      .welcome {
        background: var(--deep);
        color: white;
        border-radius: 20px;
        padding: 27px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
        margin-bottom: 21px;
        min-height: 158px;
      }
      .welcome:after {
        content: "✳";
        font-size: 210px;
        position: absolute;
        right: 23%;
        top: -72px;
        color: #ffffff08;
        line-height: 1;
      }
      .welcome h2 {
        font: 800 24px Manrope;
        margin: 0 0 8px;
        letter-spacing: -0.7px;
      }
      .welcome p {
        margin: 0;
        color: #b1beb5;
        font-size: 13px;
      }
      .welcome b {
        color: var(--lime);
      }
      .welcome .wtext {
        position: relative;
        z-index: 1;
      }
      .welcome .waction {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 9px;
      }
      .btn {
        border: 0;
        padding: 11px 15px;
        border-radius: 10px;
        background: var(--lime);
        color: var(--deep);
        font-size: 12px;
        font-weight: 800;
      }
      .btn.ghost {
        background: #ffffff13;
        border: 1px solid #ffffff2c;
        color: #fff;
      }
      .grid {
        display: grid;
        gap: 15px;
      }
      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 20px;
      }
      .weight-grid { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, .9fr); gap:15px; }
      .weight-form { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:end; }
      .weight-form .field:last-of-type { grid-column:1 / -1; }
      .weight-chart { width:100%; height:auto; min-height:190px; overflow:visible; }
      .weight-history-row { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #eef0ec; font-size:12px; }
      .weight-change { font-weight:800; }
      .weight-change.gain { color:#43815b; }
      .weight-change.loss { color:#bd634f; }
      @media (max-width:760px) { .weight-grid { grid-template-columns:1fr; } }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .stat-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .stat-icon {
        width: 31px;
        height: 31px;
        border-radius: 10px;
        background: #f1f5ea;
        display: grid;
        place-items: center;
        font-size: 15px;
      }
      .stat-value {
        font: 800 24px Manrope;
        letter-spacing: -0.7px;
        margin: 16px 0 3px;
      }
      .stat-note {
        font-size: 10px;
        color: var(--muted);
      }
      .pos {
        color: #4e963e;
      }
      .neg {
        color: #dc6856;
      }
      .dashgrid {
        grid-template-columns: 1.2fr 0.8fr;
        align-items: stretch;
      }
      .card-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .card-title h3 {
        font: 800 14px Manrope;
        margin: 0;
      }
      .card-title small {
        font-size: 10px;
        color: var(--muted);
      }
      .bars {
        height: 157px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 0 8px;
        position: relative;
      }
      .bars:before,
      .bars:after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px dashed #e8ece6;
        top: 33%;
      }
      .bars:after {
        top: 66%;
      }
      .bar-col {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        gap: 8px;
        z-index: 1;
        flex: 1;
      }
      .bar-pair {
        display: flex;
        align-items: end;
        gap: 4px;
        height: 83%;
        width: 100%;
        justify-content: center;
      }
      .bar {
        width: min(17px, 38%);
        border-radius: 5px 5px 2px 2px;
        background: #d8e6c8;
        min-height: 3px;
      }
      .bar.in {
        background: #c5f36b;
      }
      .bar.out {
        background: #25392c;
      }
      .bar-col small {
        font-size: 9px;
        color: var(--muted);
      }
      .legend {
        display: flex;
        gap: 17px;
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
      }
      .quick {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .quick button {
        padding: 14px 12px;
        background: #f7f8f4;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: left;
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
      }
      .quick button span {
        display: block;
        font-size: 19px;
        margin-bottom: 9px;
      }
      .activity {
        margin-top: 18px;
      }
      .txrow {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid #eef0ec;
      }
      .txrow:last-child {
        border: 0;
      }
      .txico {
        height: 34px;
        width: 34px;
        border-radius: 10px;
        background: #f2f5ee;
        display: grid;
        place-items: center;
      }
      .txrow b {
        font-size: 11px;
        display: block;
      }
      .txrow small {
        font-size: 9px;
        color: var(--muted);
      }
      .txamt {
        font-size: 12px;
        font-weight: 800;
      }
      .money-filters {
        display: grid;
        grid-template-columns: minmax(180px, 1.5fr) repeat(4, minmax(125px, 1fr));
        gap: 9px;
        margin-bottom: 16px;
      }
      @media (max-width: 900px) { .money-filters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

      .person-balance { margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#f4f7ef; border-color:#dce7cf; }
      .person-balance small { color:var(--muted); font-size:10px; }
      .person-balance-breakdown { margin-top:5px; color:var(--ink); font-size:11px; }
      .person-balance-total { font-weight:800; font-size:16px; text-align:right; }
      @media (max-width:600px) { .person-balance { align-items:flex-start; flex-direction:column; } .person-balance-total { text-align:left; } }
      .loan-check {
        grid-column: 2 / -1;
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 10px;
        cursor: pointer;
      }
      .loan-check input { accent-color: #83a943; }
      @media (max-width: 600px) {
        .money-filters { grid-template-columns: 1fr 1fr; }
        .money-filters input[type="search"] { grid-column: 1 / -1; }
      }
      .toolbar {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar .btn {
        padding: 10px 14px;
      }
      .input {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--ink);
        font-size: 12px;
        outline: none;
      }
      .input:focus {
        border-color: #9bc452;
      }
      .input[type="text"]:not(#username), .input[type="search"], textarea.input { text-transform: capitalize; }
      .toolbar .input:first-child {
        max-width: 260px;
      }
      .table-wrap {
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: auto;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
      }
      .table th {
        text-align: left;
        padding: 13px 15px;
        background: #f7f8f5;
        color: #839087;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .table td {
        padding: 13px 15px;
        border-top: 1px solid #edf0ec;
        font-size: 11px;
      }
      .tag {
        display: inline-block;
        background: #f0f4ea;
        padding: 5px 8px;
        border-radius: 7px;
        font-size: 9px;
        font-weight: 700;
        color: #52614d;
      }
      .tag.income {
        background: #ecf7e2;
        color: #548333;
      }
      .tag.loan {
        background: #fff1e8;
        color: #b66a38;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font: 800 16px Manrope;
        margin-bottom: 7px;
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin: 22px 0 14px;
      }
      .sectionhead h2 {
        font: 800 18px Manrope;
        margin: 0 0 4px;
      }
      .sectionhead p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .workoutdays {
        display: grid;
        grid-template-columns: repeat(7, minmax(110px, 1fr));
        gap: 8px;
        overflow: auto;
        padding-bottom: 5px;
      }
      .daybtn {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 12px 10px;
        text-align: left;
        min-width: 110px;
      }
      .daybtn.active {
        background: var(--deep);
        color: white;
        border-color: var(--deep);
      }
      .daybtn strong {
        display: block;
        font-size: 11px;
      }
      .daybtn small {
        font-size: 9px;
        color: var(--muted);
      }
      .daybtn.active small {
        color: #bfccbf;
      }
      .rest-timer { margin:15px 0; display:flex; align-items:center; justify-content:space-between; gap:16px; background:#f6f8f2; border-color:#e2e9d8; }
      .rest-timer-copy h3 { margin:0 0 4px; font:800 14px Manrope; }
      .rest-timer-copy p { margin:0; color:var(--muted); font-size:10px; }
      .rest-timer-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
      .rest-clock { min-width:76px; font:800 25px Manrope; color:var(--deep); text-align:center; font-variant-numeric:tabular-nums; }
      .rest-presets { display:flex; gap:4px; }
      .rest-presets button { background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 9px; font-size:10px; }
      .rest-presets button.active { background:var(--deep); border-color:var(--deep); color:#fff; }
      @media(max-width:600px) { .rest-timer { align-items:flex-start; flex-direction:column; } .rest-timer-controls { justify-content:flex-start; } }
      .exercisegrid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .exercise {
        padding: 17px;
      }
      .exercise-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .exercise h4 {
        font: 700 13px Manrope;
        margin: 1px 0 5px;
      }
      .exercise p {
        font-size: 10px;
        color: var(--muted);
        margin: 0;
      }
      .exercise .done {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: #f1f4ed;
        border: 0;
        color: #657263;
      }
      .exercise.checked {
        border-color: #bde477;
        background: #fbfff6;
      }
      .exercise.checked .done {
        background: var(--lime);
      }
      .macrogrid {
        grid-template-columns: repeat(4, 1fr);
        margin-bottom: 15px;
      }
      .macro {
        padding: 14px 16px;
      }
      .macro span {
        font-size: 10px;
        color: var(--muted);
      }
      .macro b {
        display: block;
        font: 800 19px Manrope;
        margin-top: 7px;
      }
      .mealgrid {
        grid-template-columns: repeat(2, 1fr);
      }
      .meal {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 12px;
        align-items: start;
      }
      .meal-icon {
        height: 38px;
        width: 38px;
        background: #f1f5e8;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 18px;
      }
      .meal h4 {
        font: 700 12px Manrope;
        margin: 0 0 4px;
      }
      .meal p {
        font-size: 10px;
        color: var(--muted);
        margin: 0;
        line-height: 1.5;
      }
      .meal small {
        font-size: 9px;
        color: #7f9a50;
        font-weight: 700;
        white-space: nowrap;
      }
      .meal.checked {
        border-color: #bfe680;
      }
      .meal.checked .meal-icon {
        background: var(--lime);
      }
      .today-plan-grid { grid-template-columns: 1fr 1fr; margin: 18px 0; }
      .today-list { display:grid; gap:8px; max-height:390px; overflow:auto; }
      .today-item { display:grid; grid-template-columns:28px 1fr auto; gap:9px; align-items:center; padding:8px 9px; border-radius:10px; background:#f8f9f6; }
      .today-item .mark { width:25px; height:25px; border-radius:8px; display:grid; place-items:center; background:#eef1e9; font-size:12px; }
      .today-item.checked .mark { background:var(--lime); }
      .today-item b { display:block; font-size:10px; }
      .today-item small { color:var(--muted); font-size:9px; }
      .today-item .meal-time { font-size:9px; color:#70806f; white-space:nowrap; }
      .loan-status { display:inline-flex; align-items:center; gap:6px; font-size:10px; white-space:nowrap; }
      .loan-status input { accent-color:#81ad42; width:15px; height:15px; cursor:pointer; }
      .loan-pending { color:#b2673c; }
      .loan-settled { color:#548333; }
      @media (max-width:760px) { .today-plan-grid { grid-template-columns:1fr; } }
      .progress {
        height: 6px;
        background: #eef1e9;
        border-radius: 5px;
        margin-top: 12px;
        overflow: hidden;
      }
      .progress i {
        height: 100%;
        display: block;
        background: #a8d75e;
        border-radius: 5px;
      }
      .modal-back {
        position: fixed;
        inset: 0;
        background: #10191380;
        display: none;
        place-items: center;
        padding: 18px;
        z-index: 10;
      }
      .modal-back.open {
        display: grid;
      }
      .modal {
        width: min(700px, 100%);
        max-height: 90vh;
        overflow:auto;
        background: white;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 25px 90px #0003;
      }
      .plan-editor-list { display:grid; gap:10px; max-height:46vh; overflow:auto; padding:2px; }
      .plan-editor-row { background:#f7f8f4; border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:9px; }
      .plan-editor-row .field.wide { grid-column:1/-1; }
      .plan-editor-row .remove-row { justify-self:end; grid-column:1/-1; }
      .plan-editor-row textarea { min-height:54px; resize:vertical; }
      .editor-scope { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#f0f4e9; padding:10px 12px; border-radius:10px; margin-top:12px; }
      .editor-scope label { font-size:11px; font-weight:700; }
      @media(max-width:460px) { .plan-editor-row { grid-template-columns:1fr; } .plan-editor-row .field.wide { grid-column:auto; } }
      .modal h2 {
        font: 800 18px Manrope;
        margin: 0 0 5px;
      }
      .modal p {
        color: var(--muted);
        font-size: 11px;
        margin: 0 0 19px;
      }
      .formgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field.full {

      function goalPeriodStart(cadence, date = new Date()) {
        if (cadence === "once") return "2000-01-01";

        if (cadence === "daily") return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, "0")}-${String(value.getDate()).padStart(2, "0")}`;
        if (cadence === "weekly") value.setDate(value.getDate() - ((value.getDay() + 6) % 7));
        if (cadence === "monthly") value.setDate(1);
        if (cadence === "yearly") value.setMonth(0, 1);

      }
      function goalPeriodAtOffset(cadence, offset) {

        if (cadence === "once") return "2000-01-01";
        if (cadence === "daily") now.setDate(now.getDate() - offset);
        if (cadence === "weekly") now.setDate(now.getDate() - offset * 7);
        if (cadence === "monthly") return goalPeriodStart(cadence, new Date(now.getFullYear(), now.getMonth() - offset, 1, 12));
        if (cadence === "yearly") return goalPeriodStart(cadence, new Date(now.getFullYear() - offset, 0, 1, 12));

      async function toggleLoanSettlement(id, isSettled) {

      async function saveLoanSettlement(loan, isSettled, phone = "", whatsappTab = null, receiptNote = "", paymentAmount = 0) {
        const previousRepaid = Number(loan.repaid_amount || (loan.is_settled ? loan.amount : 0));
        const paidThisTime = isSettled ? Number(paymentAmount) : 0;
        const totalRepaid = isSettled ? Math.min(Number(loan.amount), Math.round((previousRepaid + paidThisTime) * 100) / 100) : previousRepaid;
        const remaining = Math.max(0, Math.round((Number(loan.amount) - totalRepaid) * 100) / 100);

          if (match) {
            $("#txPhone").value = match.phone;
            $("#txPhoneHelp").textContent = "Saved number auto-filled. Zarurat ho to edit karein; naya number bhi save ho jayega.";
          } else {
            $("#txPhoneHelp").textContent = "Naya number save hoga aur agli baar naam select karne par auto-fill hoga. Number yahan edit bhi kar sakte hain.";
          }
        };
        $("#txPerson").addEventListener("input", fillSavedPhone);
        syncPersonField();
        $("#cancelModal").onclick = closeModal;
        $("#txnForm").onsubmit = async (e) => {
          e.preventDefault();
          const kind = $("#txKind").value;
          const sendsReceipt = ["lent", "borrowed", "repayment"].includes(kind);
          const phone = whatsappNumber($("#txPhone").value);
          if (sendsReceipt && (phone.length < 10 || phone.length > 15)) {
            toast("Sahi WhatsApp number daalein");
            return;
          }
          const whatsappTab = sendsReceipt ? window.open("about:blank", "_blank") : null;
          let payload = {
            user_id: user.id,
            kind,
            amount: +$("#txAmount").value,
            occurred_on: $("#txDate").value,
            title: capitalizeWords($("#txTitle").value),
            category: capitalizeWords($("#txCategory").value),
            person: capitalizeWords($("#txPerson").value) || null,
            note: capitalizeWords($("#txNote").value) || null,
            ...(sendsReceipt ? { whatsapp_phone: phone } : {}),
            ...(sendsReceipt ? { receipt_note: $("#txReceiptNote").value.trim() || null } : {}),
          };
          $("#saveTxn").disabled = true;
          let { data, error } = await supabase
            .from("transactions")
            .insert(payload)
            .select()
            .single();
          if (error) {
            whatsappTab?.close();
            $("#saveTxn").disabled = false;
            toast(error.message.includes("whatsapp_phone") || error.message.includes("receipt_note") ? "Receipt fields ke liye transaction-whatsapp-phone-migration.sql run karein" : error.message);
            return;
          }
          if (sendsReceipt) {
            await supabase.from("transactions").update({ whatsapp_phone: phone }).eq("user_id", user.id).eq("person", payload.person);
          }
          transactionsError = null;
          transactions.unshift(data);
          syncPersonContacts();
          closeModal();
          render();
          refreshSummaryIfReady();
          if (sendsReceipt) {
            const message = loanReceiptMessage({ ...payload, person: payload.person });
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            if (whatsappTab) whatsappTab.location.href = url;
            else window.location.href = url;
            toast("Entry save ho gayi · WhatsApp receipt ready hai");
          } else toast("Entry save ho gayi ✓");
        };
      }
      function closeModal() {
        $("#modalBack").classList.remove("open");
      }
      async function logWorkoutDay() {
        if (!workouts.length)
          return toast("Pehle exercises complete mark karein");
        toast("Workout progress save hai ✓");
      }
      window.openTxn = openTxn;
      window.go = showPage;
      window.logWorkoutDay = logWorkoutDay;
      window.editWorkoutPlan = openWorkoutEditor;
      window.editDietPlan = openDietEditor;
      $("#modalBack")?.addEventListener("click", (e) => {
        if (e.target.id === "modalBack") closeModal();
      });
      async function boot() {
        shell();
        await loadProfileData();
        await loadGoalData();
        await loadData();
        render();
        if (referenceDataError) {
          toast("Supabase plan tables/data missing. supabase-setup.sql run karke reload karein.");
        }
        if (planEditorError) {
          toast("Plan edit save karne ke liye plan-editor-migration.sql run karein.");
        }
        let err = [...document.querySelectorAll(".page")]
          .map((x) => x.textContent)
          .join("");
        if (!transactions.length && !workouts.length && !meals.length) {
          let check = await supabase.from("transactions").select("id").limit(1);
          if (
            check.error &&
            /does not exist|schema cache|permission denied/i.test(
              check.error.message,
            )
          )
            toast("Database setup chahiye — README/SQL setup dekhein");
        }
      }
      const {
        data: { session },
      } = await supabase.auth.getSession();
      if (session) {
        user = session.user;
        await boot();
      } else authScreen();
      supabase.auth.onAuthStateChange(async (_event, session) => {
        if (session && (!user || user.id !== session.user.id)) {
          user = session.user;
          await boot();
        } else if (!session && user) {
          user = null;
          authScreen();
        }
      });
    </script>
  </body>
</html>
