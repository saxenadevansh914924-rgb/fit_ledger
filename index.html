<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101713" />
    <title>FitLedger — Gym & Paisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5f1;
        --paper: #fff;
        --ink: #17221c;
        --muted: #7b877e;
        --line: #e7ebe5;
        --green: #c5f36b;
        --deep: #14231a;
        --lime: #d5ff80;
        --red: #ed795f;
        --shadow: 0 12px 40px #1930210b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr);
        min-height: 100vh;
      }
      .side {
        background: var(--deep);
        color: #fff;
        padding: 27px 18px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 8px;
        font-family: Manrope;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.7px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        background: var(--lime);
        display: grid;
        place-items: center;
        color: var(--deep);
        font-size: 21px;
      }
      .brand small {
        display: block;
        color: #94a39a;
        font: 500 10px "DM Sans";
        letter-spacing: 1.3px;
        margin-top: 2px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #7e9185;
        padding: 0 12px;
        margin-bottom: 8px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        border: 0;
        background: none;
        color: #aab7ae;
        text-align: left;
        padding: 12px 13px;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.2s;
      }
      .nav button span {
        font-size: 17px;
        width: 20px;
        text-align: center;
      }
      .nav button.active,
      .nav button:hover {
        background: #27382d;
        color: white;
      }
      .nav button.active {
        box-shadow: inset 3px 0 var(--lime);
      }
      .side-bottom {
        margin-top: auto;
      }
      .userbox {
        padding: 14px 9px;
        border-top: 1px solid #334339;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        width: 34px;
        height: 34px;
        background: #344638;
        color: var(--lime);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .userbox div:nth-child(2) {
        min-width: 0;
        flex: 1;
      }
      .userbox b {
        font-size: 12px;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .userbox small {
        font-size: 10px;
        color: #94a39a;
      }
      .logout {
        background: none;
        border: 0;
        color: #9ba99e;
        font-size: 18px;
      }
      .main {
        padding: 28px clamp(20px, 4vw, 56px) 54px;
        max-width: 1600px;
        width: 100%;
        margin: auto;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #7b877e;
        font-size: 10px;
        font-weight: 700;
      }
      .topline h1 {
        font: 800 27px Manrope;
        margin: 5px 0 0;
        letter-spacing: -1px;
      }
      .date-chip {
        background: white;
        border: 1px solid var(--line);
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 12px;
        color: #46534a;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
      }
      .welcome {
        background: var(--deep);
        color: white;
        border-radius: 20px;
        padding: 27px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
        margin-bottom: 21px;
        min-height: 158px;
      }
      .welcome:after {
        content: "✳";
        font-size: 210px;
        position: absolute;
        right: 23%;
        top: -72px;
        color: #ffffff08;
        line-height: 1;
      }
      .welcome h2 {
        font: 800 24px Manrope;
        margin: 0 0 8px;
        letter-spacing: -0.7px;
      }
      .welcome p {
        margin: 0;
        color: #b1beb5;
        font-size: 13px;
      }
      .welcome b {
        color: var(--lime);
      }
      .welcome .wtext {
        position: relative;
        z-index: 1;
      }
      .welcome .waction {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 9px;
      }
      .btn {
        border: 0;
        padding: 11px 15px;
        border-radius: 10px;
        background: var(--lime);
        color: var(--deep);
        font-size: 12px;
        font-weight: 800;
      }
      .btn.ghost {
        background: #ffffff13;
        border: 1px solid #ffffff2c;
        color: #fff;
      }
      .grid {
        display: grid;
        gap: 15px;
      }
      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 20px;
      }
      .weight-grid { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, .9fr); gap:15px; }
      .weight-form { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:end; }
      .weight-form .field:last-of-type { grid-column:1 / -1; }
      .weight-chart { width:100%; height:auto; min-height:190px; overflow:visible; }
      .weight-history-row { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #eef0ec; font-size:12px; }
      .weight-change { font-weight:800; }
      .weight-change.gain { color:#43815b; }
      .weight-change.loss { color:#bd634f; }
      @media (max-width:760px) { .weight-grid { grid-template-columns:1fr; } }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .stat-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .stat-icon {
        width: 31px;
        height: 31px;
        border-radius: 10px;
        background: #f1f5ea;
        display: grid;
        place-items: center;
        font-size: 15px;
      }
      .stat-value {
        font: 800 24px Manrope;
        letter-spacing: -0.7px;
        margin: 16px 0 3px;
      }
      .stat-note {
        font-size: 10px;
        color: var(--muted);
      }
      .pos {
        color: #4e963e;
      }
      .neg {
        color: #dc6856;
      }
      .dashgrid {
        grid-template-columns: 1.2fr 0.8fr;
        align-items: stretch;
      }
      .card-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .card-title h3 {
        font: 800 14px Manrope;
        margin: 0;
      }
      .card-title small {
        font-size: 10px;
        color: var(--muted);
      }
      .bars {
        height: 157px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 0 8px;
        position: relative;
      }
      .bars:before,
      .bars:after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px dashed #e8ece6;
        top: 33%;
      }
      .bars:after {
        top: 66%;
      }
      .bar-col {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        gap: 8px;
        z-index: 1;
        flex: 1;
      }
      .bar-pair {
        display: flex;
        align-items: end;
        gap: 4px;
        height: 83%;
        width: 100%;
        justify-content: center;
      }
      .bar {
        width: min(17px, 38%);
        border-radius: 5px 5px 2px 2px;
        background: #d8e6c8;
        min-height: 3px;
      }
      .bar.in {
        background: #c5f36b;
      }
      .bar.out {
        background: #25392c;
      }
      .bar-col small {
        font-size: 9px;
        color: var(--muted);
      }
      .legend {
        display: flex;
        gap: 17px;
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
      }
      .quick {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .quick button {
        padding: 14px 12px;
        background: #f7f8f4;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: left;
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
      }
      .quick button span {
        display: block;
        font-size: 19px;
        margin-bottom: 9px;
      }
      .activity {
        margin-top: 18px;
      }
      .txrow {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid #eef0ec;
      }
      .txrow:last-child {
        border: 0;
      }
      .txico {
        height: 34px;
        width: 34px;
        border-radius: 10px;
        background: #f2f5ee;
        display: grid;
        place-items: center;
      }
      .txrow b {
        font-size: 11px;
        display: block;
      }
      .txrow small {
        font-size: 9px;
        color: var(--muted);
      }
      .txamt {
        font-size: 12px;
        font-weight: 800;
      }
      .money-filters {
        display: grid;
        grid-template-columns: minmax(180px, 1.5fr) repeat(4, minmax(125px, 1fr));
        gap: 9px;
        margin-bottom: 16px;
      }
      @media (max-width: 900px) { .money-filters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

      .person-balance { margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#f4f7ef; border-color:#dce7cf; }
      .person-balance small { color:var(--muted); font-size:10px; }
      .person-balance-breakdown { margin-top:5px; color:var(--ink); font-size:11px; }
      .person-balance-total { font-weight:800; font-size:16px; text-align:right; }
      @media (max-width:600px) { .person-balance { align-items:flex-start; flex-direction:column; } .person-balance-total { text-align:left; } }
      .loan-check {
        grid-column: 2 / -1;
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 10px;
        cursor: pointer;
      }
      .loan-check input { accent-color: #83a943; }
      @media (max-width: 600px) {
        .money-filters { grid-template-columns: 1fr 1fr; }
        .money-filters input[type="search"] { grid-column: 1 / -1; }
      }
      .toolbar {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar .btn {
        padding: 10px 14px;
      }
      .input {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--ink);
        font-size: 12px;
        outline: none;
      }
      .input:focus {
        border-color: #9bc452;
      }
      .input[type="text"]:not(#username), .input[type="search"], textarea.input { text-transform: capitalize; }
      .toolbar .input:first-child {
        max-width: 260px;
      }
      .table-wrap {
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: auto;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
      }
      .table th {
        text-align: left;
        padding: 13px 15px;
        background: #f7f8f5;
        color: #839087;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .table td {
        padding: 13px 15px;
        border-top: 1px solid #edf0ec;
        font-size: 11px;
      }
      .tag {
        display: inline-block;
        background: #f0f4ea;
        padding: 5px 8px;
        border-radius: 7px;
        font-size: 9px;
        font-weight: 700;
        color: #52614d;
      }
      .tag.income {
        background: #ecf7e2;
        color: #548333;
      }
      .tag.loan {
        background: #fff1e8;
        color: #b66a38;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font: 800 16px Manrope;
        margin-bottom: 7px;
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin: 22px 0 14px;
      }
      .sectionhead h2 {
        font: 800 18px Manrope;
        margin: 0 0 4px;
      }
      .sectionhead p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .workoutdays {
        display: grid;
        grid-template-columns: repeat(7, minmax(110px, 1fr));
        gap: 8px;
        overflow: auto;
        padding-bottom: 5px;
      }
      .daybtn {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 12px 10px;
        text-align: left;
        min-width: 110px;
      }
      .daybtn.active {
        background: var(--deep);
        color: white;
        border-color: var(--deep);
      }
      .daybtn strong {
        display: block;
        font-size: 11px;
      }
      .daybtn small {
        font-size: 9px;
        color: var(--muted);
      }
      .daybtn.active small {
        color: #bfccbf;
      }
      .rest-timer { margin:15px 0; display:flex; align-items:center; justify-content:space-between; gap:16px; background:#f6f8f2; border-color:#e2e9d8; }
      .rest-timer-copy h3 { margin:0 0 4px; font:800 14px Manrope; }
      .rest-timer-copy p { margin:0; color:var(--muted); font-size:10px; }
      .rest-timer-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
      .rest-clock { min-width:76px; font:800 25px Manrope; color:var(--deep); text-align:center; font-variant-numeric:tabular-nums; }
      .rest-presets { display:flex; gap:4px; }
      .rest-presets button { background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 9px; font-size:10px; }
      .rest-presets button.active { background:var(--deep); border-color:var(--deep); color:#fff; }
      @media(max-width:600px) { .rest-timer { align-items:flex-start; flex-direction:column; } .rest-timer-controls { justify-content:flex-start; } }
      .exercisegrid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .exercise {
        padding: 17px;
      }
      .exercise-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .exercise h4 {
        font: 700 13px Manrope;
        margin: 1px 0 5px;
      }
      .exercise p {
        font-size: 10px;
        color: var(--muted);
        margin: 0;
      }
      .exercise .done {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: #f1f4ed;
        border: 0;
        color: #657263;
      }
      .exercise.checked {
        border-color: #bde477;
        background: #fbfff6;
      }
      .exercise.checked .done {
        background: var(--lime);
      }
      .macrogrid {
        grid-template-columns: repeat(4, 1fr);
        margin-bottom: 15px;
      }
      .macro {
        padding: 14px 16px;
      }
      .macro span {
        font-size: 10px;
        color: var(--muted);
      }
      .macro b {
        display: block;
        font: 800 19px Manrope;
        margin-top: 7px;
      }
      .mealgrid {
        grid-template-columns: repeat(2, 1fr);
      }
      .meal {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 12px;
        align-items: start;
      }
      .meal-icon {
        height: 38px;
        width: 38px;
        background: #f1f5e8;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 18px;
      }
      .meal h4 {
        font: 700 12px Manrope;
        margin: 0 0 4px;
      }
      .meal p {
        font-size: 10px;
        color: var(--muted);
        margin: 0;
        line-height: 1.5;
      }
      .meal small {
        font-size: 9px;
        color: #7f9a50;
        font-weight: 700;
        white-space: nowrap;
      }
      .meal.checked {
        border-color: #bfe680;
      }
      .meal.checked .meal-icon {
        background: var(--lime);
      }
      .today-plan-grid { grid-template-columns: 1fr 1fr; margin: 18px 0; }
      .today-list { display:grid; gap:8px; max-height:390px; overflow:auto; }
      .today-item { display:grid; grid-template-columns:28px 1fr auto; gap:9px; align-items:center; padding:8px 9px; border-radius:10px; background:#f8f9f6; }
      .today-item .mark { width:25px; height:25px; border-radius:8px; display:grid; place-items:center; background:#eef1e9; font-size:12px; }
      .today-item.checked .mark { background:var(--lime); }
      .today-item b { display:block; font-size:10px; }
      .today-item small { color:var(--muted); font-size:9px; }
      .today-item .meal-time { font-size:9px; color:#70806f; white-space:nowrap; }
      .loan-status { display:inline-flex; align-items:center; gap:6px; font-size:10px; white-space:nowrap; }
      .loan-status input { accent-color:#81ad42; width:15px; height:15px; cursor:pointer; }
      .loan-pending { color:#b2673c; }
      .loan-settled { color:#548333; }
      @media (max-width:760px) { .today-plan-grid { grid-template-columns:1fr; } }
      .progress {
        height: 6px;
        background: #eef1e9;
        border-radius: 5px;
        margin-top: 12px;
        overflow: hidden;
      }
      .progress i {
        height: 100%;
        display: block;
        background: #a8d75e;
        border-radius: 5px;
      }
      .modal-back {
        position: fixed;
        inset: 0;
        background: #10191380;
        display: none;
        place-items: center;
        padding: 18px;
        z-index: 10;
      }
      .modal-back.open {
        display: grid;
      }
      .modal {
        width: min(700px, 100%);
        max-height: 90vh;
        overflow:auto;
        background: white;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 25px 90px #0003;
      }
      .plan-editor-list { display:grid; gap:10px; max-height:46vh; overflow:auto; padding:2px; }
      .plan-editor-row { background:#f7f8f4; border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:9px; }
      .plan-editor-row .field.wide { grid-column:1/-1; }
      .plan-editor-row .remove-row { justify-self:end; grid-column:1/-1; }
      .plan-editor-row textarea { min-height:54px; resize:vertical; }
      .editor-scope { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#f0f4e9; padding:10px 12px; border-radius:10px; margin-top:12px; }
      .editor-scope label { font-size:11px; font-weight:700; }
      @media(max-width:460px) { .plan-editor-row { grid-template-columns:1fr; } .plan-editor-row .field.wide { grid-column:auto; } }
      .modal h2 {
        font: 800 18px Manrope;
        margin: 0 0 5px;
      }
      .modal p {
        color: var(--muted);
        font-size: 11px;
        margin: 0 0 19px;
      }
      .formgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label {
        font-size: 10px;
        font-weight: 700;
        color: #657168;
      }
      .field input,
      .field select {
        width: 100%;
      }
      .modal-actions {
        display: flex;
        justify-content: end;
        gap: 8px;
        margin-top: 19px;
      }
      .btn.subtle {
        background: #f1f3ee;
        color: #5c685e;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translate(-50%, 20px);
        opacity: 0;
        background: #18271d;
        color: white;
        padding: 11px 16px;
        border-radius: 10px;
        font-size: 12px;
        transition: 0.25s;

        const maxConsistency = Math.max(1, workoutDates.size, mealDates.size);
        const maxCash = Math.max(1, income + repayment + borrowed + lentReturnedInMonth, expense + lent + borrowedRepaidInMonth);
        const conclusionHtml = `<section class="card report-conclusion"><div class="card-title"><h3>Monthly conclusion & charts</h3><small>${esc(monthLabel)}</small></div><p>Is mahine <b>${workoutDates.size}</b> din workout log hua, <b>${mealDates.size}</b> din meals log hue, <b>${monthWeightLogs.length}</b> weight readings aur <b>${monthTransactions.length}</b> money entries record hui. Kharchon mein sabse badi category <b>${expenseByCategory.length ? esc(expenseByCategory[0][0]) + ` (${money(expenseByCategory[0][1])})` : "—"}</b> rahi. Net money movement: <b>${money(netMovement)}</b>.</p><div class="report-chart-grid"><div><h4>Workout & meal logging · days</h4><div class="report-bar-row"><span>Workout days</span><div class="report-bar-track"><div class="report-bar-fill" style="width:${Math.min(100, workoutDates.size / daysCount * 100)}%"></div></div><b>${workoutDates.size}/${daysCount}</b></div><div class="report-bar-row"><span>Meal log days</span><div class="report-bar-track"><div class="report-bar-fill" style="width:${Math.min(100, mealDates.size / daysCount * 100)}%"></div></div><b>${mealDates.size}/${daysCount}</b></div><h4>Money movement · rupees</h4><div class="report-bar-row"><span>Money in*</span><div class="report-bar-track"><div class="report-bar-fill" style="width:${Math.min(100, (income + repayment + borrowed + lentReturnedInMonth) / maxCash * 100)}%"></div></div><b>${money(income + repayment + borrowed + lentReturnedInMonth)}</b></div><div class="report-bar-row"><span>Money out*</span><div class="report-bar-track"><div class="report-bar-fill out" style="width:${Math.min(100, (expense + lent + borrowedRepaidInMonth) / maxCash * 100)}%"></div></div><b>${money(expense + lent + borrowedRepaidInMonth)}</b></div><small>*Income, udhar liya/wapas mila vs kharcha, udhar diya/chukaya.</small></div><div><h4>Expense category split</h4><div class="report-pie-wrap"><div class="report-pie" style="background:${expensePie}"></div><div class="report-legend">${categoryLegend}</div></div></div></div></section>`;
        const currentWorkoutOverride = planOverrides.find(x => x.plan_type === "workout" && x.target_date === today());
        const currentWorkoutDay = Number(currentWorkoutOverride?.plan_day || workouts[0]?.day_number || (new Date().getDay() || 7));
        const currentWorkout = plan[currentWorkoutDay - 1];
        const currentMealsSnapshot = mealPlan.map(([time, name, icon, description]) => {
          const slot = name === "Evening oats" ? "Evening meal" : name;
          const variation = dietOverrideActive ? null : weeklyVariations.find(x => x.weekday_number === (new Date().getDay() || 7) && caseKey(x.meal_slot) === caseKey(slot));
          return `<div class="txrow"><div class="txico">${esc(icon)}</div><div><b>${esc(time)} · ${esc(name)}</b><small>${esc(variation?.description || description)}</small></div></div>`;
        }).join("");
        const planSnapshotHtml = `<div class="grid dashgrid"><div class="card"><div class="card-title"><h3>Aaj ka workout plan · Day ${currentWorkoutDay}${currentWorkout ? ` · ${esc(currentWorkout[0])}` : ""}</h3><small>Latest saved plan</small></div>${currentWorkout ? currentWorkout[2].map(([name, reps]) => `<div class="txrow"><div class="txico">◉</div><div><b>${esc(name)}</b><small>${esc(reps)}</small></div></div>`).join("") : '<div class="empty">Workout plan load nahi hua.</div>'}</div><div class="card"><div class="card-title"><h3>Aaj ka diet plan</h3><small>Latest saved plan</small></div>${currentMealsSnapshot || '<div class="empty">Diet plan load nahi hua.</div>'}</div></div>`;
        $("#page-summary").innerHTML = `<div class="sectionhead no-print"><div><h2>Monthly progress report</h2><p>Supabase se aayi money, workout aur meal history.</p></div><div style="display:flex;gap:8px;align-items:center"><input class="input" id="summaryMonth" type="month" value="${esc(summaryMonth)}"><button class="btn" id="downloadSummary">↓ Download PDF</button></div></div><div class="notice no-print">PDF ke liye button dabayein, phir browser print window mein <b>Save as PDF</b> chunein.</div><div class="welcome summary-cover"><div class="wtext"><div class="eyebrow" style="color:#9eaf9f">FITLEDGER · MONTHLY REPORT</div><h2>${esc(monthLabel)}</h2><p>Money habits · Workout consistency · Meal tracking</p></div><div class="waction"><span class="tag" style="background:#ffffff19;color:white">${workoutDates.size} workout days</span></div></div>${planSnapshotHtml}<div class="grid stats"><div class="card"><div class="stat-head">Total kharcha <span class="stat-icon">↘</span></div><div class="stat-value">${money(expense)}</div><div class="stat-note">${monthTransactions.filter(x => x.kind === "expense").length} entries</div></div><div class="card"><div class="stat-head">Income <span class="stat-icon">↗</span></div><div class="stat-value">${money(income)}</div><div class="stat-note">${monthTransactions.filter(x => x.kind === "income").length} entries</div></div><div class="card"><div class="stat-head">Udhar diya / liya <span class="stat-icon">⇄</span></div><div class="stat-value">${money(lent)} / ${money(borrowed)}</div><div class="stat-note">${money(lentReturnedInMonth)} wapas mile · ${money(borrowedRepaidInMonth)} chukaye · Pending lena ${money(pendingLent)} / dena ${money(pendingBorrowed)} · Net ${money(netMovement)}</div></div><div class="card"><div class="stat-head">Training & diet <span class="stat-icon">◉</span></div><div class="stat-value">${monthWorkouts.length} / ${monthMeals.length}</div><div class="stat-note">Exercise / meal check-ins · ${mealDates.size} meal-log days</div></div></div><div class="grid dashgrid"><div class="card"><div class="card-title"><h3>Weekly money movement</h3><small>Income + udhar liya vs kharcha + diya</small></div><div class="bars">${weeks.map(w => `<div class="bar-col"><div class="bar-pair"><i class="bar in" title="${money(w.got)}" style="height:${Math.max(3, w.got / maxWeek * 100)}%"></i><i class="bar out" title="${money(w.out)}" style="height:${Math.max(3, w.out / maxWeek * 100)}%"></i></div><small>${w.label}</small></div>`).join("")}</div><div class="legend"><span><i class="dot" style="background:#c5f36b"></i>Aaye</span><span><i class="dot" style="background:#25392c"></i>Gaye / udhar</span></div></div><div class="card"><div class="card-title"><h3>Monthly consistency</h3><small>${daysCount} calendar days</small></div><div class="quick"><div><span>◉</span><b>${workoutDates.size}</b><small> workout days</small></div><div><span>♡</span><b>${mealDates.size}</b><small> meal-log days</small></div><div><span>✓</span><b>${monthWorkouts.length}</b><small> exercises done</small></div><div><span>₹</span><b>${monthTransactions.length}</b><small> money entries</small></div></div></div></div><div class="card activity"><div class="card-title"><h3>Daily workout & meal progress</h3><small>${esc(monthLabel)}</small></div><div class="table-wrap"><table class="table summary-daily-table"><thead><tr><th>Date</th><th>Workout plan</th><th>Exercises checked</th><th>Meals</th></tr></thead><tbody>${workoutDailyRows}</tbody></table></div></div><div class="card activity"><div class="card-title"><h3>Daily money entries</h3><small>${monthTransactions.length} entries</small></div><div class="table-wrap"><table class="table summary-daily-table"><thead><tr><th>Date</th><th>Details</th><th>Type</th><th>Category</th><th>Person</th><th>Amount</th><th>Status</th></tr></thead><tbody>${financeRows}</tbody></table></div></div>${weightSummaryHtml}${conclusionHtml}`;
        $("#summaryMonth").onchange = () => { summaryMonth = $("#summaryMonth").value || today().slice(0, 7); renderSummary(); };
        $("#downloadSummary").onclick = () => window.print();
      }
      function editorScopeMarkup() {
        return `<div class="editor-scope"><label for="planScope">Save changes:</label><select class="input" id="planScope"><option value="permanent">Permanently</option><option value="date">Only on selected date</option></select><input class="input" id="planOverrideDate" type="date" value="${today()}" style="display:none"><small>Permanent changes update your saved plan. A date-only edit applies to that date only.</small></div>`;
      }
      function bindEditorScope() {
        const scope = $("#planScope"), date = $("#planOverrideDate");
        scope.onchange = () => { date.style.display = scope.value === "date" ? "block" : "none"; date.required = scope.value === "date"; };
      }
      function addWorkoutEditorRow(name = "", prescription = "") {
        $("#planEditorList").insertAdjacentHTML("beforeend", `<div class="plan-editor-row workout-edit-row"><div class="field"><label>Exercise</label><input class="input ex-name" required value="${esc(name)}" placeholder="Exercise name"></div><div class="field"><label>Sets / reps</label><input class="input ex-reps" required value="${esc(prescription)}" placeholder="3 × 8–12"></div><button type="button" class="btn subtle remove-row" aria-label="Remove exercise">Remove</button></div>`);
        $("#planEditorList .remove-row:last-child").onclick = e => e.currentTarget.closest(".workout-edit-row").remove();
      }
      function openWorkoutEditor() {
        if (!plan[activeDay - 1]) return toast("Workout plan Supabase se load nahi hua");
        const day = plan[activeDay - 1];
        $("#modal").innerHTML = `<h2>Edit Day ${activeDay} · ${esc(day[0])}</h2><p>Exercise add, edit ya remove karein; phir permanent ya ek date ke liye save karein.</p><form id="planEditorForm"><div class="plan-editor-list" id="planEditorList"></div><button type="button" class="btn subtle" id="addPlanRow">＋ Exercise add karein</button>${editorScopeMarkup()}<div class="modal-actions"><button type="button" class="btn subtle" id="cancelModal">Cancel</button><button class="btn" id="savePlan">Save workout plan</button></div></form>`;
        $("#modalBack").classList.add("open");
        day[2].forEach(x => addWorkoutEditorRow(x[0], x[1]));
        $("#addPlanRow").onclick = () => addWorkoutEditorRow();
        bindEditorScope();
        $("#cancelModal").onclick = closeModal;
        $("#planEditorForm").onsubmit = async e => {
          e.preventDefault();
          const data = [...document.querySelectorAll(".workout-edit-row")].map(row => ({ name: capitalizeWords(row.querySelector(".ex-name").value), prescription: capitalizeWords(row.querySelector(".ex-reps").value) })).filter(x => x.name);
          if (!data.length) return toast("Kam se kam ek exercise rakhein");
          await savePlanOverride("workout", activeDay, data);
        };
      }
      function addDietEditorRow(meal = {}) {
        const key = meal.key || `custom-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
        $("#planEditorList").insertAdjacentHTML("beforeend", `<div class="plan-editor-row diet-edit-row" data-key="${esc(key)}"><div class="field"><label>Time</label><input class="input meal-time-input" required value="${esc(meal.time || "")}" placeholder="8:00 AM"></div><div class="field"><label>Meal name</label><input class="input meal-name-input" required value="${esc(meal.name || "")}" placeholder="Breakfast"></div><div class="field"><label>Icon</label><input class="input meal-icon-input" value="${esc(meal.icon || "🍽️")}" maxlength="8"></div><div class="field"><label>Calories</label><input class="input meal-cal-input" type="number" min="0" value="${Number(meal.calories || 0)}"></div><div class="field"><label>Protein (g)</label><input class="input meal-protein-input" type="number" min="0" step="0.1" value="${Number(meal.protein || 0)}"></div><div class="field wide"><label>Meal details</label><textarea class="input meal-desc-input" required placeholder="Ingredients and portion">${esc(meal.description || "")}</textarea></div><button type="button" class="btn subtle remove-row" aria-label="Remove meal">Remove</button></div>`);
        $("#planEditorList .remove-row:last-child").onclick = e => e.currentTarget.closest(".diet-edit-row").remove();
      }
      function openDietEditor() {
        $("#modal").innerHTML = `<h2>Edit / Add daily diet plan</h2><p>Meal time, food, calories aur protein update karein. Changes permanent ya ek selected date ke liye save ho sakte hain.</p><form id="planEditorForm"><div class="plan-editor-list" id="planEditorList"></div><button type="button" class="btn subtle" id="addPlanRow">＋ Meal add karein</button>${editorScopeMarkup()}<div class="modal-actions"><button type="button" class="btn subtle" id="cancelModal">Cancel</button><button class="btn" id="savePlan">Save diet plan</button></div></form>`;
        $("#modalBack").classList.add("open");
        mealPlan.forEach(([time, name, icon, description, calories, protein, key]) => addDietEditorRow({ time, name, icon, description, calories, protein, key }));
        $("#addPlanRow").onclick = () => addDietEditorRow();
        bindEditorScope();
        $("#cancelModal").onclick = closeModal;
        $("#planEditorForm").onsubmit = async e => {
          e.preventDefault();
          const data = [...document.querySelectorAll(".diet-edit-row")].map(row => ({ key: row.dataset.key, time: row.querySelector(".meal-time-input").value.trim(), name: capitalizeWords(row.querySelector(".meal-name-input").value), icon: row.querySelector(".meal-icon-input").value.trim() || "🍽️", description: capitalizeWords(row.querySelector(".meal-desc-input").value), calories: Number(row.querySelector(".meal-cal-input").value || 0), protein: Number(row.querySelector(".meal-protein-input").value || 0) })).filter(x => x.name);
          if (!data.length) return toast("Kam se kam ek meal rakhein");
          await savePlanOverride("diet", null, data);
        };
      }
      async function savePlanOverride(type, dayNumber, planData) {
        const scope = $("#planScope").value;
        const targetDate = scope === "date" ? $("#planOverrideDate").value : null;
        if (scope === "date" && !targetDate) return toast("Date select karein");
        const existing = planOverrides.find(x => x.plan_type === type && (type !== "workout" || Number(x.plan_day) === Number(dayNumber)) && x.target_date === targetDate);
        const values = { plan_type: type, plan_day: type === "workout" ? dayNumber : null, target_date: targetDate, plan_data: planData, updated_at: new Date().toISOString() };
        const result = existing
          ? await supabase.from("user_plan_overrides").update(values).eq("id", existing.id).select().single()
          : await supabase.from("user_plan_overrides").insert({ ...values, user_id: user.id }).select().single();
        if (result.error) {
          toast(result.error.message.includes("user_plan_overrides") ? "Supabase mein plan-editor-migration.sql run karein" : result.error.message);
          return;
        }
        closeModal();
        await loadData();
        render();
        refreshSummaryIfReady();
        toast(scope === "date" ? "Is date ka plan save ho gaya ✓" : "Permanent plan save ho gaya ✓");
      }
      function openTxn(kind = "expense") {
        let names = {
          expense: "Kharcha",
          income: "Income",
          lent: "Udhar diya",
          repayment: "Udhar wapas mila",
          borrowed: "Udhar liya",
        };
        $("#modal").innerHTML =
          `<h2>Nayi money entry</h2><p>Apna daily hisaab yahan record karein.</p><form id="txnForm"><div class="formgrid"><div class="field full"><label>Entry type</label><select class="input" id="txKind">${Object.entries(
            names,
          )
            .map(
              ([k, n]) =>
                `<option value="${k}" ${kind === k ? "selected" : ""}>${n}</option>`,
            )
            .join(
              "",
            )}</select></div><div class="field"><label>Amount (₹)</label><input class="input" id="txAmount" type="number" min="1" step="0.01" required placeholder="500"></div><div class="field"><label>Date</label><input class="input" id="txDate" type="date" value="${today()}" required></div><div class="field"><label>Title</label><input class="input" id="txTitle" required placeholder="Lunch, salary..."></div><div class="field"><label>Category</label><select class="input" id="txCategory"><option>Food</option><option>Travel</option><option>Gym</option><option>Shopping</option><option>Salary</option><option>Personal</option><option>Other</option></select></div><div class="field full"><label>Person (udhar ke liye)</label><input class="input" id="txPerson" placeholder="Naam (optional)"></div><div class="field full"><label>Note (optional)</label><input class="input" id="txNote" placeholder="Extra detail"></div></div><div class="modal-actions"><button type="button" class="btn subtle" id="cancelModal">Cancel</button><button class="btn" id="saveTxn">Save entry</button></div></form>`;
        $("#modalBack").classList.add("open");
        const syncPersonField = () => {
          const borrowed = $("#txKind").value === "borrowed";
          $("#txPerson").required = borrowed;
          if (borrowed && !$("#txTitle").value) {
            $("#txTitle").value = "Udhar liya";
            $("#txCategory").value = "Personal";
          }
          $("#txPerson").previousElementSibling.textContent = borrowed
            ? "Kis person se udhar liya? *"
            : "Person (udhar ke liye)";
          $("#txPerson").placeholder = borrowed
            ? "Naam likhein"
            : "Naam (optional)";
        };
        $("#txKind").onchange = syncPersonField;
        syncPersonField();
        $("#cancelModal").onclick = closeModal;
        $("#txnForm").onsubmit = async (e) => {
          e.preventDefault();
          let payload = {
            user_id: user.id,
            kind: $("#txKind").value,
            amount: +$("#txAmount").value,
            occurred_on: $("#txDate").value,
            title: capitalizeWords($("#txTitle").value),
            category: capitalizeWords($("#txCategory").value),
            person: capitalizeWords($("#txPerson").value) || null,
            note: capitalizeWords($("#txNote").value) || null,
          };
          $("#saveTxn").disabled = true;
          let { data, error } = await supabase
            .from("transactions")
            .insert(payload)
            .select()
            .single();
          if (error) {
            $("#saveTxn").disabled = false;
            toast(error.message);
            return;
          }
          transactionsError = null;
          transactions.unshift(data);
          closeModal();
          render();
          refreshSummaryIfReady();
          toast("Entry save ho gayi ✓");
        };
      }
      function closeModal() {
        $("#modalBack").classList.remove("open");
      }
      async function logWorkoutDay() {
        if (!workouts.length)
          return toast("Pehle exercises complete mark karein");
        toast("Workout progress save hai ✓");
      }
      window.openTxn = openTxn;
      window.go = showPage;
      window.logWorkoutDay = logWorkoutDay;
      window.editWorkoutPlan = openWorkoutEditor;
      window.editDietPlan = openDietEditor;
      $("#modalBack")?.addEventListener("click", (e) => {
        if (e.target.id === "modalBack") closeModal();
      });
      async function boot() {
        shell();
        await loadData();
        render();
        if (referenceDataError) {
          toast("Supabase plan tables/data missing. supabase-setup.sql run karke reload karein.");
        }
        if (planEditorError) {
          toast("Plan edit save karne ke liye plan-editor-migration.sql run karein.");
        }
        let err = [...document.querySelectorAll(".page")]
          .map((x) => x.textContent)
          .join("");
        if (!transactions.length && !workouts.length && !meals.length) {
          let check = await supabase.from("transactions").select("id").limit(1);
          if (
            check.error &&
            /does not exist|schema cache|permission denied/i.test(
              check.error.message,
            )
          )
            toast("Database setup chahiye — README/SQL setup dekhein");
        }
      }
      const {
        data: { session },
      } = await supabase.auth.getSession();
      if (session) {
        user = session.user;
        await boot();
      } else authScreen();
      supabase.auth.onAuthStateChange(async (_event, session) => {
        if (session && (!user || user.id !== session.user.id)) {
          user = session.user;
          await boot();
        } else if (!session && user) {
          user = null;
          authScreen();
        }
      });
    </script>
  </body>
</html>
